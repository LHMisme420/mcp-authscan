version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: vata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DB_NAME: vata
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: postgres
      JWT_SECRET_KEY: dev-secret-change-in-prod
    ports:
      - "5000:5000"
    depends_on:
      - postgres

volumes:
  postgres_data:
