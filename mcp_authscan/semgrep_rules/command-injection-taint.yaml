# mcp-authscan taint engine -- OS command injection (CWE-78)
#
# The MCP STDIO-spawn RCE class: untrusted tool/request input reaching a shell or
# process-spawn sink with no escaping/argument-array sanitization. Fires only on a
# traced source->sink path within one function (OSS taint is intra-FUNCTION;
# cross-function/file is Semgrep Pro). HIGH-confidence detectors; they gate CI.
rules:
  - id: mcp-cmdi-taint-js
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      OS command injection: untrusted input reaches a shell/exec sink without
      escaping (CWE-78). The mcp-authscan taint engine traced the dataflow path.
    metadata:
      rule: T2-CMDI
      category: security
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command"]
      owasp: ["A03:2021 - Injection"]
      confidence: HIGH
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: req.query
              - pattern: req.body
              - pattern: req.params
              - pattern: request.query
              - pattern: request.body
              - pattern: request.params
              - pattern: ctx.query
              - pattern: ctx.request.body
              - pattern: $R.headers
              - pattern: $C.req.query(...)
              - pattern: $C.req.param(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: shellQuote(...)
          - pattern: shellescape(...)
          - pattern: $Q.quote(...)
    pattern-sinks:
      - patterns:
          - focus-metavariable: $CMD
          - pattern-either:
              - pattern: $CP.exec($CMD, ...)
              - pattern: $CP.execSync($CMD, ...)
              - pattern: exec($CMD, ...)
              - pattern: execSync($CMD, ...)
              - pattern: $CP.spawn($CMD, ...)
              - pattern: $CP.spawnSync($CMD, ...)
              - pattern: $CP.execFile($CMD, ...)

  - id: mcp-cmdi-taint-python
    mode: taint
    languages: [python]
    severity: ERROR
    message: >
      OS command injection: untrusted input reaches a shell/exec sink without
      escaping (CWE-78). The mcp-authscan taint engine traced the dataflow path.
    metadata:
      rule: T2-CMDI
      category: security
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command"]
      owasp: ["A03:2021 - Injection"]
      confidence: HIGH
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: request.args.get(...)
              - pattern: request.args[...]
              - pattern: request.form.get(...)
              - pattern: request.values.get(...)
              - pattern: request.json
              - pattern: request.get_json(...)
              - pattern: request.GET.get(...)
              - pattern: request.POST.get(...)
              # Raw request body in a stdlib http.server handler (common in MCP mocks
              # and lightweight servers): self.rfile.read(...) is untrusted input.
              - pattern: $SELF.rfile.read(...)
    pattern-sanitizers:
      # shlex.quote escapes for a shell. shlex.split is NOT a sanitizer -- it only
      # tokenizes, and the attacker still controls the resulting argv. A named
      # validator/allowlist that returns the vetted command clears the taint.
      - pattern-either:
          - pattern: shlex.quote(...)
          - pattern: $V._validate(...)
          - pattern: $V.validate_command(...)
          - pattern: assert_allowed_command(...)
    pattern-sinks:
      - patterns:
          - focus-metavariable: $CMD
          - pattern-either:
              - pattern: os.system($CMD)
              - pattern: os.popen($CMD, ...)
              # No shell=True needed: Popen/run/call with an attacker-controlled argv
              # executes an arbitrary program (argv[0] is attacker-chosen) -- RCE.
              - pattern: subprocess.call($CMD, ...)
              - pattern: subprocess.run($CMD, ...)
              - pattern: subprocess.Popen($CMD, ...)
              - pattern: subprocess.check_output($CMD, ...)
              - pattern: subprocess.check_call($CMD, ...)

  - id: mcp-cmdi-taint-go
    mode: taint
    languages: [go]
    severity: ERROR
    message: >
      OS command injection: untrusted input reaches a shell/exec sink without
      escaping (CWE-78). The mcp-authscan taint engine traced the dataflow path.
    metadata:
      rule: T2-CMDI
      category: security
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command"]
      owasp: ["A03:2021 - Injection"]
      confidence: HIGH
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $R.URL.Query().Get(...)
              - pattern: $R.FormValue(...)
              - pattern: $R.Header.Get(...)
    pattern-sinks:
      - patterns:
          - focus-metavariable: $CMD
          - pattern-either:
              - pattern: exec.Command("sh", "-c", $CMD)
              - pattern: exec.Command("bash", "-c", $CMD)
              - pattern: exec.CommandContext($CTX, "sh", "-c", $CMD)
              - pattern: exec.CommandContext($CTX, "bash", "-c", $CMD)
