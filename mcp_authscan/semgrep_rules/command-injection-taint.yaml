# mcp-authscan taint engine -- OS command injection (CWE-78)
#
# The MCP STDIO-spawn RCE class: untrusted tool/request input reaching a shell or
# process-spawn sink with no escaping/argument-array sanitization. Fires only on a
# traced source->sink path within one function (OSS taint is intra-FUNCTION;
# cross-function/file is Semgrep Pro). HIGH-confidence detectors; they gate CI.
rules:
  - id: mcp-cmdi-taint-js
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      OS command injection: untrusted input reaches a shell/exec sink without
      escaping (CWE-78). The mcp-authscan taint engine traced the dataflow path.
    metadata:
      rule: T2-CMDI
      category: security
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command"]
      owasp: ["A03:2021 - Injection"]
      confidence: HIGH
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $R.query
              - pattern: $R.body
              - pattern: $R.params
              - pattern: $R.headers
              - pattern: $C.req.query(...)
              - pattern: $C.req.param(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: shellQuote(...)
          - pattern: shellescape(...)
          - pattern: $Q.quote(...)
    pattern-sinks:
      - patterns:
          - focus-metavariable: $CMD
          - pattern-either:
              - pattern: $CP.exec($CMD, ...)
              - pattern: $CP.execSync($CMD, ...)
              - pattern: exec($CMD, ...)
              - pattern: execSync($CMD, ...)
              - pattern: $CP.spawn($CMD, ...)
              - pattern: $CP.spawnSync($CMD, ...)
              - pattern: $CP.execFile($CMD, ...)

  - id: mcp-cmdi-taint-python
    mode: taint
    languages: [python]
    severity: ERROR
    message: >
      OS command injection: untrusted input reaches a shell/exec sink without
      escaping (CWE-78). The mcp-authscan taint engine traced the dataflow path.
    metadata:
      rule: T2-CMDI
      category: security
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command"]
      owasp: ["A03:2021 - Injection"]
      confidence: HIGH
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: request.args.get(...)
              - pattern: request.args[...]
              - pattern: request.form.get(...)
              - pattern: request.values.get(...)
              - pattern: request.json
              - pattern: request.get_json(...)
              - pattern: request.GET.get(...)
              - pattern: request.POST.get(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: shlex.quote(...)
          - pattern: shlex.split(...)
    pattern-sinks:
      - patterns:
          - focus-metavariable: $CMD
          - pattern-either:
              - pattern: os.system($CMD)
              - pattern: os.popen($CMD, ...)
              - pattern: subprocess.call($CMD, ..., shell=True, ...)
              - pattern: subprocess.run($CMD, ..., shell=True, ...)
              - pattern: subprocess.Popen($CMD, ..., shell=True, ...)
              - pattern: subprocess.check_output($CMD, ..., shell=True, ...)

  - id: mcp-cmdi-taint-go
    mode: taint
    languages: [go]
    severity: ERROR
    message: >
      OS command injection: untrusted input reaches a shell/exec sink without
      escaping (CWE-78). The mcp-authscan taint engine traced the dataflow path.
    metadata:
      rule: T2-CMDI
      category: security
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command"]
      owasp: ["A03:2021 - Injection"]
      confidence: HIGH
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $R.URL.Query().Get(...)
              - pattern: $R.FormValue(...)
              - pattern: $R.Header.Get(...)
    pattern-sinks:
      - patterns:
          - focus-metavariable: $CMD
          - pattern-either:
              - pattern: exec.Command("sh", "-c", $CMD)
              - pattern: exec.Command("bash", "-c", $CMD)
              - pattern: exec.CommandContext($CTX, "sh", "-c", $CMD)
              - pattern: exec.CommandContext($CTX, "bash", "-c", $CMD)
