[pytest]
testpaths = tests
# pytest defaults (.* *.egg _darcs build CVS dist node_modules venv {arch}) must be restated:
# setting norecursedirs replaces them. Large untracked trees are listed explicitly.
norecursedirs = .* *.egg _darcs build CVS dist node_modules venv {arch} hol-guard mcp-server-cloudflare nova-proximity mcp-authscan-evidence matrix tests/fixtures _archive app_tests
addopts = --ignore=test_scanner_local.py
