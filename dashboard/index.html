<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VATA - MCP Security Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.5/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .app {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            color: white;
            margin-bottom: 40px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .auth-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .auth-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .auth-form input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        .auth-form input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .auth-form button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        
        .auth-form button:hover {
            background: #5568d3;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .card h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        
        .metric {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }
        
        .metric-label {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }
        
        .findings-list {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .findings-list h3 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .finding-item {
            padding: 15px;
            border-left: 4px solid #667eea;
            background: #f9f9f9;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        
        .finding-server {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .finding-vector {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        
        .severity-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
        }
        
        .severity-critical {
            background: #fee;
            color: #c00;
        }
        
        .severity-high {
            background: #fef3e0;
            color: #ff9800;
        }
        
        .severity-medium {
            background: #fff9c4;
            color: #f57f17;
        }
        
        .severity-low {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .chart-container {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        
        .chart-container h3 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .error {
            color: #c00;
            padding: 15px;
            background: #fee;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        
        .success {
            color: #2e7d32;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 6px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        function Dashboard() {
            const [apiKey, setApiKey] = useState('');
            const [jwt, setJwt] = useState(localStorage.getItem('vata_jwt') || '');
            const [authenticated, setAuthenticated] = useState(!!localStorage.getItem('vata_jwt'));
            const [findings, setFindings] = useState([]);
            const [complianceScore, setComplianceScore] = useState(0);
            const [severityBreakdown, setSeverityBreakdown] = useState({});
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [success, setSuccess] = useState('');
            const chartRef = useRef(null);
            
            const handleRegister = async () => {
                setLoading(true);
                setError('');
                try {
                    const res = await fetch('http://127.0.0.1:5000/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ org_name: 'MyOrg' })
                    });
                    const data = await res.json();
                    setApiKey(data.api_key);
                    localStorage.setItem('vata_api_key', data.api_key);
                    setSuccess('Organization registered! API key: ' + data.api_key);
                } catch (e) {
                    setError('Failed to register: ' + e.message);
                }
                setLoading(false);
            };
            
            const handleLogin = async () => {
                setLoading(true);
                setError('');
                try {
                    const res = await fetch('http://127.0.0.1:5000/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ api_key: apiKey })
                    });
                    const data = await res.json();
                    if (data.error) {
                        setError('Login failed: ' + data.error);
                        return;
                    }
                    setJwt(data.access_token);
                    localStorage.setItem('vata_jwt', data.access_token);
                    localStorage.setItem('vata_api_key', apiKey);
                    setAuthenticated(true);
                    setSuccess('Logged in successfully!');
                    loadDashboard(data.access_token);
                } catch (e) {
                    setError('Login failed: ' + e.message);
                }
                setLoading(false);
            };
            
            const loadDashboard = async (token) => {
                try {
                    const [findingsRes, reportRes] = await Promise.all([
                        fetch('http://127.0.0.1:5000/api/findings', {
                            headers: { 'Authorization': `Bearer ${token}` }
                        }),
                        fetch('http://127.0.0.1:5000/api/reports/compliance', {
                            method: 'POST',
                            headers: { 
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ framework: 'SOC2' })
                        })
                    ]);
                    
                    const findingsData = await findingsRes.json();
                    const reportData = await reportRes.json();
                    
                    setFindings(findingsData.findings || []);
                    setComplianceScore(reportData.compliance_score || 100);
                    setSeverityBreakdown(reportData.severity_breakdown || {});
                } catch (e) {
                    setError('Failed to load dashboard: ' + e.message);
                }
            };
            
            useEffect(() => {
                if (authenticated && jwt) {
                    loadDashboard(jwt);
                }
            }, [authenticated, jwt]);
            
            useEffect(() => {
                if (authenticated && chartRef.current && Object.keys(severityBreakdown).length > 0) {
                    try {
                        const ctx = chartRef.current.getContext('2d');
                        new Chart(ctx, {
                            type: 'doughnut',
                            data: {
                                labels: Object.keys(severityBreakdown),
                                datasets: [{
                                    data: Object.values(severityBreakdown),
                                    backgroundColor: ['#c00', '#ff9800', '#f57f17', '#2e7d32']
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: true
                            }
                        });
                    } catch(e) {}
                }
            }, [severityBreakdown, authenticated]);
            
            const handleLogout = () => {
                localStorage.removeItem('vata_jwt');
                localStorage.removeItem('vata_api_key');
                setAuthenticated(false);
                setJwt('');
                setApiKey('');
                setError('');
                setSuccess('');
            };
            
            return (
                <div className="app">
                    <div className="header">
                        <h1>🔐 VATA Security Dashboard</h1>
                        <p>MCP Ecosystem Security Monitoring</p>
                    </div>
                    
                    {!authenticated ? (
                        <div className="auth-section">
                            <h3>Authentication</h3>
                            {error && <div className="error">{error}</div>}
                            {success && <div className="success">{success}</div>}
                            <div className="auth-form">
                                <input
                                    type="text"
                                    placeholder="Paste API Key from scanner output"
                                    value={apiKey}
                                    onChange={(e) => setApiKey(e.target.value)}
                                />
                                <button onClick={handleLogin} disabled={!apiKey || loading}>
                                    {loading ? 'Logging in...' : 'Login'}
                                </button>
                                <button onClick={handleRegister} disabled={loading}>
                                    {loading ? 'Registering...' : 'Register New'}
                                </button>
                            </div>
                        </div>
                    ) : (
                        <>
                            <button onClick={handleLogout} style={{marginBottom: '20px', padding: '10px 20px', background: '#667eea', color: 'white', border: 'none', borderRadius: '6px', cursor: 'pointer'}}>
                                Logout
                            </button>
                            
                            {error && <div className="error">{error}</div>}
                            {success && <div className="success">{success}</div>}
                            
                            <div className="dashboard">
                                <div className="card">
                                    <h3>Compliance Score</h3>
                                    <div className="metric">{complianceScore}%</div>
                                    <div className="metric-label">SOC 2 Framework</div>
                                </div>
                                
                                <div className="card">
                                    <h3>Total Findings</h3>
                                    <div className="metric">{findings.length}</div>
                                    <div className="metric-label">Across all servers</div>
                                </div>
                                
                                <div className="card">
                                    <h3>Critical Issues</h3>
                                    <div className="metric">{severityBreakdown.CRITICAL || 0}</div>
                                    <div className="metric-label">Require immediate action</div>
                                </div>
                            </div>
                            
                            {Object.keys(severityBreakdown).length > 0 && (
                                <div className="chart-container">
                                    <h3>Severity Distribution</h3>
                                    <canvas ref={chartRef}></canvas>
                                </div>
                            )}
                            
                            {findings.length > 0 && (
                                <div className="findings-list">
                                    <h3>Recent Findings</h3>
                                    {findings.slice(0, 10).map((finding, idx) => (
                                        <div key={idx} className="finding-item">
                                            <div className="finding-server">{finding.server_url}</div>
                                            <div className="finding-vector">{finding.vector_type}</div>
                                            <span className={`severity-badge severity-${finding.severity?.toLowerCase() || 'low'}`}>
                                                {finding.severity || 'LOW'}
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </>
                    )}
                </div>
            );
        }
        
        ReactDOM.render(<Dashboard />, document.getElementById('root'));
    </script>
</body>
</html>
