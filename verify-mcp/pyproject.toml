[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-authscan-verify"
version = "0.1.3"
description = "Stdio MCP server exposing one tool: recompute an mcp-authscan report hash and check its signature."
dependencies = ["mcp-authscan"]

[project.scripts]
mcp-authscan-verify = "verify_server:serve"

[tool.setuptools]
py-modules = ["verify_server"]
