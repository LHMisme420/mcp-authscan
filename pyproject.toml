[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-authscan"
dynamic = ["version"]
description = "Static security scanner for self-rolled OAuth/auth failure classes in MCP servers, gateways, and OAuth clients. Rules seeded from live-reproduced, chain-of-custody-anchored VATA findings. SARIF output for GitHub code scanning."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Leroy H. Mason" }]
keywords = ["mcp", "security", "oauth", "pkce", "sast", "sarif", "scanner", "vulnerability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/LHMisme420/mcp-authscan"
Repository = "https://github.com/LHMisme420/mcp-authscan"
Dashboard = "https://lhmisme420.github.io/VATA-SCORES-0311"

[project.scripts]
mcp-authscan = "mcp_authscan:main"

[tool.setuptools]
py-modules = ["mcp_authscan"]

[tool.setuptools.dynamic]
version = { attr = "mcp_authscan.VERSION" }
