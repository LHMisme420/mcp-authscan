[build-system]
requires = ["setuptools>=84.2.1,<85", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-authscan"
version = "1.1.9"  # keep in sync with mcp_authscan.__version__
description = """MCP AuthScan
Security scanner for MCP server deployments you are authorised to test. Python 3.11+.

pip install mcp-authscan
mcp-authscan scan target.example.com/mcp

Each scan returns a verdict per probe, not a score:
PASS the property was positively demonstrated
FAIL the property was demonstrably absent, with a severity attached
NOT_OBSERVED the probe ran but the response established neither
EXCLUDED the probe could not run, with the missing prerequisite named, and it leaves the coverage denominator

Coverage is conclusive probes over the in-scope set; EXCLUDED is counted separately. Text, JSON and SARIF 2.1.0 output. --fail-on severity gates CI. Baselines carry an expiry date and a reason. Every report records target, start and end, exit code, tool version, probe-set version and a content hash covering the authorization, scan mode, verdicts and findings, with the header block outside the hash. Tokens, cookies, API keys and email addresses are redacted from the captured evidence.

Use it only against targets you own or have written permission to test. Reports are written to be handed to someone who wasn't on the call.

Exit codes are in EXIT_CODES.md. MIT. Repo: github.com/LHMisme420/mcp-authscan"""
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Leroy H. Mason", email = "lhmisme2011@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.34.2,<3",
    "certifi>=2026.10.23",
    "idna>=3.20,<4",
    "pillow>=13.0.0,<14",
    "reportlab>=5.1.0,<6",
]
keywords = ["mcp", "model-context-protocol", "security", "scanner",
            "authentication", "authorization", "appsec", "devsecops", "sarif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/LHMisme420/mcp-authscan"
Repository = "https://github.com/LHMisme420/mcp-authscan"
Issues = "https://github.com/LHMisme420/mcp-authscan/issues"
Changelog = "https://github.com/LHMisme420/mcp-authscan/blob/main/CHANGELOG.md"

[project.scripts]
mcp-authscan = "mcp_authscan.cli_wrapper:main"

[tool.setuptools]
# This project root is the package itself; web imports keep their existing paths.
packages = ["mcp_authscan"]
package-dir = {mcp_authscan = "mcp_authscan"}

[tool.mypy]
files = ["mcp_authscan"]
