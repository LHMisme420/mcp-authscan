[build-system]
requires = ["setuptools>=84.2.1,<85", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-authscan"
version = "1.1.46"  # single source of truth
description = "MCP security assessment and deployment authorization with cryptographically signed evidence, authentication assurance, freshness enforcement, replay resistance, reproducible reports, and CI/CD policy gates."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Leroy H. Mason", email = "lhmisme2011@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.34.2,<3",
    "certifi>=2026.10.23",
    "idna>=3.20,<4",
    "pillow>=13.0.0,<14",
    "reportlab>=5.1.0,<6",
    "cryptography>=50.0.2,<51",
]
keywords = ["mcp", "model-context-protocol", "security", "scanner",
            "authentication", "authorization", "appsec", "devsecops", "sarif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
signing = ["cryptography>=50.0.2,<51"]

[project.urls]
Homepage = "https://github.com/LHMisme420/mcp-authscan"
Repository = "https://github.com/LHMisme420/mcp-authscan"
Issues = "https://github.com/LHMisme420/mcp-authscan/issues"
Changelog = "https://github.com/LHMisme420/mcp-authscan/blob/main/CHANGELOG.md"

[project.scripts]
mcp-authscan = "mcp_authscan.cli_wrapper:main"

[tool.setuptools]
# This project root is the package itself; web imports keep their existing paths.
packages = ["mcp_authscan", "mcp_authscan.evidence"]
package-dir = {mcp_authscan = "mcp_authscan"}

[tool.mypy]
files = ["mcp_authscan"]

[tool.setuptools.package-data]
mcp_authscan = ["policy-default.json", "keys-default.json", "probe_set_catalog.json", "key_history.json"]
