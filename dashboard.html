<!DOCTYPE html>
<html>
<head>
  <title>VATA Security Dashboard</title>
  <style>
    :root {
      --bg: #0f1419;
      --bg-card: #1a1f26;
      --fg: #e4e6eb;
      --fg-secondary: #adb5c9;
      --critical: #ff3838;
      --high: #ffa940;
      --medium: #ffd666;
      --low: #52c41a;
      --divider: #2a3142;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 24px; }
    header { border-bottom: 1px solid var(--divider); padding-bottom: 24px; margin-bottom: 32px; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    .subtitle { color: var(--fg-secondary); font-size: 14px; }
    
    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 40px; }
    .metric-card { background: var(--bg-card); border: 1px solid var(--divider); border-radius: 8px; padding: 20px; }
    .metric-label { color: var(--fg-secondary); font-size: 12px; text-transform: uppercase; margin-bottom: 12px; }
    .metric-value { font-size: 40px; font-weight: 600; margin-bottom: 8px; font-family: monospace; }
    
    .findings-table { width: 100%; border-collapse: collapse; background: var(--bg-card); border: 1px solid var(--divider); border-radius: 8px; margin-top: 20px; }
    .findings-table th { background: #232a34; padding: 12px; text-align: left; font-size: 12px; color: var(--fg-secondary); border-bottom: 1px solid var(--divider); }
    .findings-table td { padding: 12px; border-bottom: 1px solid var(--divider); }
    .findings-table tbody tr:hover { background: #232a34; }
    
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .badge-critical { background: var(--critical); color: white; }
    .badge-high { background: var(--high); color: white; }
    .badge-medium { background: var(--medium); color: white; }
    
    .loading { text-align: center; padding: 40px; color: var(--fg-secondary); }
    .error { color: var(--critical); padding: 20px; background: rgba(255, 56, 56, 0.1); border-radius: 8px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>🛡️ VATA Security Dashboard</h1>
    <p class="subtitle">Real-time vulnerability intelligence and compliance tracking</p>
  </header>
  
  <div id="error" class="error" style="display:none;"></div>
  <div id="loading" class="loading">Loading dashboard...</div>
  <div id="content" style="display:none;">
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-label">Threat Score</div>
        <div class="metric-value" id="threatScore">0%</div>
        <div>
          <span class="badge badge-critical" id="criticalCount">0 Critical</span>
          <span class="badge badge-high" id="highCount" style="margin-left: 8px;">0 High</span>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Total Findings</div>
        <div class="metric-value" id="totalFindings">0</div>
      </div>
    </div>
    
    <h2>Recent Findings</h2>
    <table class="findings-table">
      <thead>
        <tr>
          <th>Vector Type</th>
          <th>Severity</th>
          <th>Description</th>
          <th>Found</th>
        </tr>
      </thead>
      <tbody id="findingsTable">
        <tr><td colspan="4" style="text-align: center; padding: 40px; color: var(--fg-secondary);">No findings yet</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const API_URL = window.location.origin;
    
    async function loadDashboard() {
      try {
        // Get or create token
        let token = localStorage.getItem('vata_token');
        if (!token) {
          const registerRes = await fetch(`${API_URL}/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ org_name: 'Dashboard-Viewer' })
          });
          const registerData = await registerRes.json();
          token = registerData.access_token;
          localStorage.setItem('vata_token', token);
        }
        
        // Fetch all data
        const [threatRes, findingsRes, complianceRes] = await Promise.all([
          fetch(`${API_URL}/api/threat-intelligence`, {
            headers: { 'Authorization': `Bearer ${token}` }
          }),
          fetch(`${API_URL}/api/findings`, {
            headers: { 'Authorization': `Bearer ${token}` }
          }),
          fetch(`${API_URL}/api/reports/compliance`, {
            headers: { 'Authorization': `Bearer ${token}` }
          })
        ]);
        
        const threatData = await threatRes.json();
        const findingsData = await findingsRes.json();
        const complianceData = await complianceRes.json();
        
        // Update metrics
        document.getElementById('threatScore').textContent = complianceData.compliance_score + '%';
        document.getElementById('criticalCount').textContent = complianceData.critical_findings + ' Critical';
        document.getElementById('highCount').textContent = complianceData.high_findings + ' High';
        document.getElementById('totalFindings').textContent = threatData.total_findings;
        
        // Update findings table
        const tbody = document.getElementById('findingsTable');
        const findings = findingsData.findings || [];
        
        if (findings.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 40px; color: var(--fg-secondary);">No findings yet</td></tr>';
        } else {
          tbody.innerHTML = findings.reverse().map(f => `
            <tr>
              <td style="font-family: monospace; font-size: 12px;">${f.vector_type}</td>
              <td><span class="badge badge-${f.severity.toLowerCase()}">${f.severity}</span></td>
              <td>${f.description}</td>
              <td style="color: var(--fg-secondary); font-size: 12px;">${new Date(f.created_at).toLocaleDateString()}</td>
            </tr>
          `).join('');
        }
        
        // Show content
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
      } catch (e) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').textContent = 'Error: ' + e.message;
      }
    }
    
    loadDashboard();
  </script>
</body>
</html>
