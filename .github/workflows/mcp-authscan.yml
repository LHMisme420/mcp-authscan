name: MCP auth scan
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 06:00 UTC

permissions:
  contents: read
  security-events: write   # required for upload-sarif

jobs:
  mcp-authscan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mcp-authscan
        run: pip install git+https://github.com/LHMisme420/mcp-authscan.git

      - name: Run scan (SARIF)
        run: mcp-authscan . --sarif > results.sarif
        continue-on-error: true   # still upload findings if scan exits non-zero

      - name: Upload SARIF to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: mcp-authscan   # coexists with CodeQL/other scanners
