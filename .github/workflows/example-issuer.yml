name: mcp issuer binding
on:
  pull_request:
permissions:
  contents: read
jobs:
  issuer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mcp-authscan==0.9.3
      - run: mcp-authscan . --fail-on high
