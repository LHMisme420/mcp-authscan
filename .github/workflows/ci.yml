name: ci
permissions:
  contents: read
on: [push, pull_request, workflow_dispatch]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v4
      - uses: actions/setup-python@v6 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
  dep-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v4
      - uses: actions/setup-python@v6 # v5
        with:
          python-version: "3.12"
      - name: Audit runtime dependencies for known CVEs
        run: |
          pip install pip-audit
          pip-audit -r requirements-runtime.txt
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v4
      - uses: actions/setup-python@v6 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Mypy type check
        run: mypy tests/test_fixtures.py tests/test_cors_checks.py
