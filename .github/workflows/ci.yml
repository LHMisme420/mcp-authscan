name: ci
permissions:
  contents: read
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: actions/setup-python@v5 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check mcp_authscan research
  dep-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: actions/setup-python@v5 # v5
        with:
          python-version: "3.12"
      - name: Audit runtime dependencies for known CVEs
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: actions/setup-python@v5 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Mypy type check
        run: mypy mcp_authscan.py check_origin_host_validation.py check_cors_credentials_reflection.py test_fixtures.py test_cors_checks.py
  cors-scanner-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: actions/setup-python@v5 # v5
        with:
          python-version: "3.12"
      - run: pip install flask requests
      - name: Run CORS scanner tests (negative & positive control)
        run: python3 test_cors_checks.py
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: actions/setup-python@v5 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . "coverage[toml]" hypothesis   # [toml] so coverage can read pyproject on Python <3.11; unpinned per-version
      - name: Run scanner unit tests with coverage
        # Scoped to the self-contained scanner suites (the web-app/billing tests
        # need flask, which is not declared in requirements — tracked separately).
        run: >-
          coverage run -m unittest -v
          tests.test_cors_policy
          tests.test_fixture_detections
          tests.test_cli_enterprise
          tests.test_stdio_rce_research
          tests.test_exit_codes
          tests.test_properties
          tests.test_probe_accounting
      - name: Enforce coverage threshold
        run: coverage report --fail-under=22
