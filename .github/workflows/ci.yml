name: ci
permissions:
  contents: read
on: [push, pull_request, workflow_dispatch]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v4
      - uses: actions/setup-python@v6 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
  dep-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v4
      - uses: actions/setup-python@v6 # v5
        with:
          python-version: "3.12"
      - name: Audit runtime dependencies for known CVEs
        run: |
          pip install pip-audit
          pip-audit -r requirements-runtime.txt
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v4
      - uses: actions/setup-python@v6 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Mypy type check
        run: mypy tests/test_fixtures.py tests/test_cors_checks.py
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7 # v4
      - uses: actions/setup-python@v6 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ./mcp_authscan "coverage[toml]" hypothesis "setuptools>=84.2.1,<85" wheel
      - name: Run scanner unit tests with coverage
        # Scoped to the self-contained scanner suites (the web-app/billing tests
        # need flask, which is not declared in requirements — tracked separately).
        run: >-
          coverage run -m unittest -v
          tests.test_cors_policy
          tests.test_fixture_detections
          tests.test_cli_enterprise
          tests.test_cli_packaging
          tests.test_stdio_rce_research
          tests.test_exit_codes
          tests.test_exit_code_fixtures
          tests.test_oauth_token_verdicts
          tests.test_properties
          tests.test_probe_accounting
      - name: Enforce coverage threshold
        run: coverage report