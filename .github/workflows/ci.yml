name: ci
permissions:
  contents: read
on: [push, pull_request]
jobs:
  selfscan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Self-scan (must be clean)
        run: python3 mcp_authscan.py . --exclude rule_corpus --fail-on high
  ground-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Re-detect seed findings
        run: python3 tests/verify_ground_truth.py
