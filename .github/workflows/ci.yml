name: ci
permissions:
  contents: read
on: [push, pull_request]
jobs:
  web:
    name: Website typecheck, build and isolated regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Public, deliberately nonfunctional fixtures, never GitHub/workspace secrets.
      CLERK_PUBLISHABLE_KEY: pk_test_Zml4dHVyZS5jbGVyay5hY2NvdW50cy5kZXYk
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_Zml4dHVyZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_fixture_not_a_real_key
      JWT_SECRET: fixture-only-signing-key-at-least-32-characters
      PUBLIC_APP_URL: https://fixture.invalid
      VATA_BILLING_MODE: disabled
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20.20.0" # Match the Node 20 gateway runtime.
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11" # Match the startup fixture's Python user-package path.
      - name: Install locked website dependencies
        run: npm ci
      - name: Install private scanner runtime
        run: python3 -m pip install -r requirements-runtime.txt
      - name: Provide disposable PostgreSQL server binaries
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Typecheck, test payment-disabled UI and verify built startup
        # startup.test.ts starts its own loopback-only PostgreSQL service under
        # mkdtemp, ignores inherited DATABASE_URL, and tears down only that cluster.
        # No shared database, provider requests, deployment or publishing steps.
        run: npm run test:ci:web
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v4
      - uses: actions/setup-python@v7 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
  dep-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v4
      - uses: actions/setup-python@v7 # v5
        with:
          python-version: "3.12"
      - name: Audit runtime dependencies for known CVEs
        run: |
          pip install pip-audit
          pip-audit -r requirements-runtime.txt
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v4
      - uses: actions/setup-python@v7 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Mypy type check
        run: mypy
  cors-scanner-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v4
      - uses: actions/setup-python@v7 # v5
        with:
          python-version: "3.12"
      - run: pip install flask requests
      - name: Run CORS scanner tests (negative & positive control)
        run: python3 -m unittest tests.test_cors_policy -v
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7 # v4
      - uses: actions/setup-python@v7 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: "20.20.0" # Same Node as the web job; the site-verifier tests run tsx.
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked Node dependencies (tsx for the site-verifier tests)
        run: npm ci
      # requirements-dev.txt carries pytest, setuptools (test_cli_packaging builds the
      # wheel/sdist), coverage, hypothesis and wheel; the previous hand-written list
      # omitted pytest and setuptools, so those suites failed at import.
      - run: pip install -r requirements-dev.txt -e ./mcp_authscan
      - name: Run the full scanner test suite with coverage
        # pytest, not unittest: tests/conftest.py and per-module autouse fixtures
        # (egress scope, DNS stubs) only apply under pytest.
        run: coverage run -m pytest -q
      - name: Enforce coverage threshold (.coveragerc fail_under)
        run: coverage report
  compliance-report-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements-runtime.txt
      - name: Reject vulnerable Python pins and stale runtime distributions
        run: python3 -m unittest tests.test_python_dependency_security -v
      - name: Verify single-scan schema-3 hashes, PDF content and tenant isolation
        run: python3 -m unittest tests.test_scan_report_v3 -v
