name: ci
permissions:
  contents: read
on: [push, pull_request]
jobs:
  web:
    name: Website typecheck, build and isolated regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Public, deliberately nonfunctional fixtures, never GitHub/workspace secrets.
      CLERK_PUBLISHABLE_KEY: pk_test_Zml4dHVyZS5jbGVyay5hY2NvdW50cy5kZXYk
      VITE_CLERK_PUBLISHABLE_KEY: pk_test_Zml4dHVyZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_fixture_not_a_real_key
      JWT_SECRET: fixture-only-signing-key-at-least-32-characters
      PUBLIC_APP_URL: https://fixture.invalid
      VATA_BILLING_MODE: disabled
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20.20.0" # Match the Node 20 gateway runtime.
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11" # Match the startup fixture's Python user-package path.
      - name: Install locked website dependencies
        run: npm ci
      - name: Install private scanner runtime
        run: python3 -m pip install -r requirements-runtime.txt
      - name: Provide disposable PostgreSQL server binaries
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Typecheck, test payment-disabled UI and verify built startup
        # startup.test.ts starts its own loopback-only PostgreSQL service under
        # mkdtemp, ignores inherited DATABASE_URL, and tears down only that cluster.
        # No shared database, provider requests, deployment or publishing steps.
        run: npm run test:ci:web
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v4
      - uses: actions/setup-python@v7 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
  dep-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v4
      - uses: actions/setup-python@v7 # v5
        with:
          python-version: "3.12"
      - name: Audit runtime dependencies for known CVEs
        run: |
          pip install pip-audit
          pip-audit -r requirements-runtime.txt
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v4
      - uses: actions/setup-python@v7 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Mypy type check
        run: mypy
  cors-scanner-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v4
      - uses: actions/setup-python@v7 # v5
        with:
          python-version: "3.12"
      - run: pip install flask requests
      - name: Run CORS scanner tests (negative & positive control)
        run: python3 -m unittest tests.test_cors_policy -v
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7 # v4
      - uses: actions/setup-python@v7 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ./mcp_authscan "coverage[toml]" hypothesis wheel
      - name: Run scanner unit tests with coverage
        # Scoped to the self-contained scanner suites (the web-app/billing tests
        # need flask, which is not declared in requirements — tracked separately).
        run: >-
          coverage run -m unittest -v
          tests.test_cors_policy
          tests.test_fixture_detections
          tests.test_cli_enterprise
          tests.test_cli_packaging
          tests.test_stdio_rce_research
          tests.test_exit_codes
          tests.test_exit_code_fixtures
          tests.test_oauth_token_verdicts
          tests.test_properties
          tests.test_probe_accounting
      - name: Enforce coverage threshold
        run: coverage report --fail-under=55
  compliance-report-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements-runtime.txt
      - name: Reject vulnerable Python pins and stale runtime distributions
        run: python3 -m unittest tests.test_python_dependency_security -v
