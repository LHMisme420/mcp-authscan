name: ci
permissions:
  contents: read
on: [push, pull_request]
jobs:
  selfscan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Self-scan (must be clean)
        run: python3 mcp_authscan.py . --exclude rule_corpus --exclude examples --fail-on high
  ground-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Re-detect seed findings
        run: python3 tests/verify_ground_truth.py
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check mcp_authscan research
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Mypy type check
        run: mypy mcp_authscan
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . coverage   # unpinned so each Python version resolves a compatible build
      - name: Run scanner unit tests with coverage
        # Scoped to the self-contained scanner suites (the web-app/billing tests
        # need flask, which is not declared in requirements — tracked separately).
        run: >-
          coverage run -m unittest -v
          tests.test_cors_policy
          tests.test_fixture_detections
          tests.test_cli_enterprise
          tests.test_stdio_rce_research
      - name: Enforce coverage threshold
        run: coverage report
