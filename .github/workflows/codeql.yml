name: codeql
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '20 2 * * 1'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: github/codeql-action/init@v3 # v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3 # v3
